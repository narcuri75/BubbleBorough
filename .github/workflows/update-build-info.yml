name: Update Bubble Borough build info

on:
  push:

permissions:
  contents: write

jobs:
  update-build-info:
    if: github.actor != 'github-actions[bot]' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write build info
        shell: bash
        run: |
          PUSH_TIME="$(TZ=America/Los_Angeles date '+%m/%d/%Y %-I:%M %p %Z')"
          SHORT_SHA="${GITHUB_SHA::7}"

          cat > game/public/build-info.json <<EOF_JSON
          {
            "lastPushed": "${PUSH_TIME}",
            "commit": "${SHORT_SHA}"
          }
          EOF_JSON

      - name: Build GitHub Pages documents
        run: npm run build:website

      - name: Commit updated build info and static pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Build info and static pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/build-info.json index.html 404.html robots.txt sitemap.xml website/fish website/decor website/news website/faqs website/about
          git commit -m "chore: update build info and static pages"
          git push
